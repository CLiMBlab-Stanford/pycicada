name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install package and tests
        run: uv sync --extra test
      - name: Run tests
        run: uv run pytest
      - name: Build distributions
        run: uv build
