[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pycicada"
version = "0.2.0"
description = "MATLAB-free CICADA automatic ICA component classification"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY.md"]
dependencies = [
    "nibabel>=5.2,<6",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scipy>=1.12,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
pycicada = "cicada_python.cli:main"
cicada-python = "cicada_python.cli:main"

[project.urls]
Source = "https://github.com/CLiMBlab-Stanford/pycicada"
Issues = "https://github.com/CLiMBlab-Stanford/pycicada/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cicada_python = [
    "vendor/CICADA/basescripts/*",
    "vendor/CICADA/templates/*",
    "vendor/CICADA/templates/mni_icbm152_nlin_asym_09c/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
